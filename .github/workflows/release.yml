name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm Trusted Publishing (OIDC) 必需
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Trusted Publishing 需要 npm >= 11.5.1
      - run: npm install -g npm@latest
      - name: Debug OIDC environment
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "oidc-token: present"; else echo "oidc-token: MISSING"; fi
          npm --version
      - run: npm ci
      - run: npm test
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG != package.json $PKG"; exit 1
          fi
      - run: npm publish --access public --provenance
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
